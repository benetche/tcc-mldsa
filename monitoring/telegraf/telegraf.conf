# Telegraf — ESP32 (MQTT) + métricas Docker (Fabric/IoMT) → Prometheus (:9273).
# cAdvisor neste host (overlayfs/cgroup v2) não expõe label name; Docker input cobre containers.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iomt/esp32/+/metrics"]
  qos = 0
  data_format = "json"
  name_override = "esp32"
  # Campos string viram labels; numéricos viram métricas
  tag_keys = ["device_id", "sign_alg", "scenario", "signing_mode"]
  json_string_fields = ["sign_alg", "scenario", "signing_mode"]
  # Campos numéricos: heap_*, cpu_percent, wifi_rssi_dbm, sign_duration_ms,
  # sign_duration_crypto_ms, sign_fail_total, sign_ok (0/1 se bool no JSON)

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  gather_services = false

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
