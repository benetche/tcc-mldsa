# Telegraf — ponte de métricas do ESP32-D (MQTT → Prometheus).
# Consome JSON publicado pelo firmware em iomt/esp32/{device_id}/metrics
# e expõe em :9273 para o Prometheus raspar (job esp32-telegraf).

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iomt/esp32/+/metrics"]
  qos = 0
  data_format = "json"
  name_override = "esp32"
  # Campos string viram labels; numéricos viram métricas
  tag_keys = ["device_id", "sign_alg"]
  json_string_fields = ["sign_alg"]
  # Campos numéricos esperados: heap_free, heap_min, cpu_percent,
  # wifi_rssi_dbm, net_tx_bytes, net_rx_bytes, sign_duration_ms

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
