# Pilar 5 — observabilidade (opcional). Rede de laboratório isolada.
# Núcleo: prometheus + grafana + node-exporter + cadvisor
# Perfil "mqtt": mosquitto + telegraf (ponte de métricas do ESP32-D)
#
#   docker compose up -d                 # núcleo
#   docker compose --profile mqtt up -d  # núcleo + ESP32/MQTT
name: iomt-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: iomt-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: iomt-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: iomt-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: iomt-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      # overlayfs + cgroup v2: desabilitar métricas de disco que exigem layerdb (senão containers não aparecem)
      - '--housekeeping_interval=10s'
      - '--disable_metrics=disk,diskIO,percpu,sched,process,udp'
      - '--store_container_labels=true'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8080:8080"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iomt-mosquitto
    restart: unless-stopped
    profiles: ["mqtt", "full"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  telegraf:
    image: telegraf:1.31
    container_name: iomt-telegraf
    restart: unless-stopped
    profiles: ["mqtt", "full"]
    user: "0:986"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9273:9273"
    depends_on:
      - mosquitto

volumes:
  prometheus-data:
  grafana-data:
